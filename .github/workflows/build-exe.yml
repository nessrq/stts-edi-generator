name: Build EDI-Stellantis.exe

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}  # permite disparar el build manualmente

permissions:
  contents: write

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------- Frontend ----------
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---------- Backend ----------
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate obfuscated secrets module
        working-directory: backend
        env:
          SFTP_PEM: ${{ secrets.SFTP_PEM }}
          SFTP_PASSPHRASE: ${{ secrets.SFTP_PASSPHRASE }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: python build_secrets.py

      - name: Build .exe with PyInstaller
        working-directory: backend
        run: pyinstaller edi_stellantis.spec --noconfirm

      # ---------- Publicación ----------
      # Al pushear un tag (v1.0.0), crea un Release y adjunta el .exe.
      - name: Create GitHub Release and attach .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/EDI-Stellantis.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
